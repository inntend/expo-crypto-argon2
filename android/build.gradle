plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.cryptoargon2'
// Expo's module plugin requires one. The release writes the tag's version into
// package.json, so it is read from there rather than kept here by hand.
version = new groovy.json.JsonSlurper().parse(file('../package.json')).version

android {
  namespace "expo.modules.cryptoargon2"

  defaultConfig {
    externalNativeBuild {
      cmake {
        cppFlags "-std=c++17"
        arguments "-DANDROID_STL=c++_shared"
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
      version "3.22.1"
    }
  }
}
